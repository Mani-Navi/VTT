spring.application.name=V.1.0

# تنظیمات اتصال به دیتابیس PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/VTT
spring.datasource.username=postgres
spring.datasource.password=13850207
spring.datasource.driver-class-name=org.postgresql.Driver

# آپدیت خودکار جداول و فیلدهای جدید بر اساس انتیتی‌های جاوا
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# غیرفعال کردن Flyway در زمان توسعه برای آپدیت خودکار فیلدها توسط هایبرنیت
spring.flyway.enabled=false

server.port=8080

google.client-id=your-google-client-id.apps.googleusercontent.com

# تنظیمات ارسال ایمیل با جیمیل
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true